        // ===== 本文件的 JS 全部改写为 jQuery 4.0 写法 =====
        // 依赖：<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js">
        // 注意：jQuery 4.0 已删除 $.trim / $.isArray / $.isFunction / $.isNumeric / $.type / $.now，
        //       所以字符串裁剪只能用原生 String.prototype.trim。

        $(document).ready(function () {

            var $head = $('head');
            var $body = $('body');

            // 1) 用 $.map 生成每个图标的 :before 规则，用 jQuery 造 <style> 插进 <head>
            $('<style>')
                .text($.map(ICONS, function (it) {
                    return '.' + it[0] + ':before { content: "\\' + it[1] + '"; }';
                }).join('\n'))
                .appendTo($head);

            // 2) 元素引用（都是 jQuery 对象，只查一次）
            var $q = $('#q');
            var $grid = $('#grid');
            var $empty = $('#empty');
            var $cnt = $('#cnt');
            var $toast = $('#toast');
            var $tabs = $('.tab_btn');

            var tab = 'all';

            // 3) 筛选：$.grep 过滤数组，$.inArray 判断分类是否命中
            function pick() {
                var q = ($q.val() || '').trim().toLowerCase();
                return $.grep(ICONS, function (it) {
                    var name = it[0].toLowerCase();
                    if ($.inArray(tab, ['all', it[2]]) === -1) { return false; }
                    if (q && name.indexOf(q) === -1) { return false; }
                    return true;
                });
            }

            // 4) 渲染：$.each 遍历，每条都用 jQuery 建元素并 appendTo 到 #grid
            function render() {
                var picked = pick();
                var n = picked.length;

                $grid.empty();

                $.each(picked, function (i, it) {
                    $('<div>')
                        .addClass('icon_cell')
                        .attr('data_n', it[0])
                        .append($('<i>').addClass(it[0]))
                        .append($('<span>').addClass('icon_name').text(it[0]))
                        .appendTo($grid);
                });

                $empty.toggle(n === 0);
                $cnt.text('显示 ' + n + ' / ' + ICONS.length);
            }

            // 5) 复制到剪贴板
            function copyText(t) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(t);
                    return;
                }
                var $ta = $('<textarea>').val(t).appendTo($body);
                $ta.select();
                document.execCommand('copy');
                $ta.remove();
            }

            // 6) 底部提示条：整条淡入 / 保持 / 淡出都用 jQuery 的 animate 排队完成，
            //    不用 setTimeout / clearTimeout。stop(true, false) 会清掉队列里没跑完的动画，
            //    所以连续点图标时保持时间会重新计时。
            function showToast(msg) {
                $toast
                    .stop(true, false)
                    .text(msg)
                    .animate({ opacity: 1 }, 180)
                    .animate({ opacity: 1 }, 1400)
                    .animate({ opacity: 0 }, 180);
            }

            // 7) 事件绑定：全部用 jQuery 在 document 上做事件委托
            $(document).on('input', '#q', render);

            $(document).on('click', '.icon_cell', function () {
                var name = $(this).attr('data_n');
                copyText(name);
                showToast('已复制：' + name);
            });

            $(document).on('click', '.tab_btn', function () {
                tab = $(this).attr('data_tab');
                $tabs.removeClass('tab_btn_on');
                $(this).addClass('tab_btn_on');
                render();
            });

            render();
        });
    </script>
</html>
