<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    {% block mainmenu %}
    <ul>
    {% for item in menu %}
        <li>
            <a href="{% url item %}">{{ item }}</a>
        </li>
    {% endfor %}
    </ul>
    {% endblock mainmenu %}
    <div>{% block content %}{% endblock %}</div>
</body>
</html>
