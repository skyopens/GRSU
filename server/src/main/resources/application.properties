spring.application.name=grsu_graduation

spring.datasource.url=jdbc:sqlite:grsu_graduation.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Store: must be the same value as storeKey / storeSalt in client/src/environments.
store.key=qqtang_archive_store_key_2026
store.salt=qqtang_archive_store_salt_2026

# Seed source directory, relative to the server/ working directory
store.seed-dir=../client/data_raw/data_store